<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Copilot - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        githubDark: '#0d1117',
                        githubCard: '#161b22',
                        githubBorder: '#30363d',
                        githubBlue: '#1f6feb'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="bg-githubDark text-gray-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="w-full border-b border-githubBorder bg-githubDark/80 backdrop-blur sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button id="menuBtn" class="p-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-githubBorder transition">
                <span class="material-icons">menu</span>
            </button>
            <div class="flex items-center space-x-2">
                <span class="material-icons text-blue-500">smart_toy</span>
                <span class="font-semibold text-sm tracking-wide">Copilot AI</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <!-- GitHub Login / Profile Button -->
            <button id="githubAuthBtn" onclick="loginWithGitHub()" class="flex items-center space-x-2 bg-githubCard border border-githubBorder hover:bg-githubBorder px-3 py-1.5 rounded-md text-xs font-medium transition shadow-sm">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                <span id="authButtonText">Sign in with GitHub</span>
            </button>
            <button class="flex items-center space-x-1 bg-githubCard border border-githubBorder hover:bg-githubBorder px-3 py-1.5 rounded-md text-xs font-medium transition shadow-sm">
                <span class="material-icons text-xs">download</span>
                <span>Download</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        
        <!-- Central Robot Icon -->
        <div class="mb-6 p-3 bg-githubCard border border-githubBorder rounded-2xl shadow-lg">
            <span class="material-icons text-3xl text-gray-300">smart_toy</span>
        </div>

        <!-- Central Prompt Box Container -->
        <div class="w-full max-w-2xl bg-githubCard border border-githubBorder rounded-xl p-3 shadow-2xl relative">
            
            <!-- Prompt Input Textarea -->
            <textarea id="promptInput" rows="2" placeholder="Ask anything or type @ to add context" class="w-full bg-transparent text-gray-200 placeholder-gray-500 text-sm focus:outline-none resize-none px-1"></textarea>

            <!-- Toolbar inside Prompt Box -->
            <div class="flex flex-wrap items-center justify-between pt-2 border-t border-githubBorder/60 mt-2 gap-2 text-xs">
                
                <div class="flex items-center space-x-2">
                    <!-- Ask Dropdown Trigger -->
                    <button class="flex items-center space-x-1 px-2 py-1 bg-githubDark border border-githubBorder rounded hover:bg-githubBorder text-gray-300">
                        <span class="material-icons text-xs">chat_bubble_outline</span>
                        <span>Ask</span>
                        <span class="material-icons text-xs">arrow_drop_down</span>
                    </button>

                    <!-- All Repositories Dropdown Toggle Button -->
                    <div class="relative">
                        <button id="repoBtn" class="flex items-center space-x-1 px-2 py-1 bg-githubDark border border-githubBorder rounded hover:bg-githubBorder text-gray-300">
                            <span class="material-icons text-xs">folder</span>
                            <span id="selectedRepoName">All repositories</span>
                            <span class="material-icons text-xs">arrow_drop_down</span>
                        </button>

                        <!-- Repositories Dropdown Box (Initially Hidden) -->
                        <div id="repoDropdown" class="hidden absolute left-0 mt-2 w-72 bg-githubCard border border-githubBorder rounded-lg shadow-2xl z-50 p-2">
                            <div class="p-1 border-b border-githubBorder mb-1">
                                <span class="text-xs font-semibold text-gray-400 block mb-1">Select a repository</span>
                                <input type="text" id="repoSearch" placeholder="Search repositories..." class="w-full bg-githubDark text-xs px-2 py-1.5 rounded border border-githubBorder text-gray-200 focus:outline-none focus:border-blue-500">
                            </div>
                            <div id="repoList" class="max-h-48 overflow-y-auto space-y-1">
                                <!-- Real GitHub Repos will load here after login, or fallback demo items -->
                                <div class="repo-item flex items-center space-x-2 px-2 py-1.5 hover:bg-githubBorder rounded cursor-pointer text-xs">
                                    <input type="checkbox" class="rounded bg-githubDark border-githubBorder">
                                    <span class="repo-name text-gray-300">sohel622/Etagdxb</span>
                                </div>
                                <div class="repo-item flex items-center space-x-2 px-2 py-1.5 hover:bg-githubBorder rounded cursor-pointer text-xs">
                                    <input type="checkbox" class="rounded bg-githubDark border-githubBorder">
                                    <span class="repo-name text-gray-300">sohel622/Flashgram5555</span>
                                </div>
                                <div class="repo-item flex items-center space-x-2 px-2 py-1.5 hover:bg-githubBorder rounded cursor-pointer text-xs">
                                    <input type="checkbox" class="rounded bg-githubDark border-githubBorder">
                                    <span class="repo-name text-gray-300">sohel622/pixelgram-react</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button class="p-1 bg-githubDark border border-githubBorder rounded hover:bg-githubBorder text-gray-300">
                        <span class="material-icons text-xs">add</span>
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <button class="flex items-center space-x-1 text-gray-400 hover:text-white">
                        <span class="material-icons text-xs">auto_fix_high</span>
                        <span>Auto</span>
                    </button>
                    <span class="text-gray-600">|</span>
                    <button class="flex items-center space-x-1 text-gray-400 hover:text-white">
                        <span class="text-xs">Optimized for: Efficiency</span>
                        <span class="material-icons text-xs">arrow_drop_down</span>
                    </button>
                    <!-- Send Button -->
                    <button id="sendBtn" class="p-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded transition">
                        <span class="material-icons text-xs">send</span>
                    </button>
                </div>

            </div>
        </div>

        <!-- Quick Action Buttons Row -->
        <div class="flex flex-wrap items-center justify-center gap-2 mt-4">
            <button onclick="insertAction('Debug')" class="flex items-center space-x-1 px-3 py-1.5 bg-githubCard border border-githubBorder hover:bg-githubBorder rounded-lg text-xs text-gray-300 transition">
                <span class="material-icons text-xs text-blue-400">bug_report</span>
                <span>Debug</span>
            </button>
            <button onclick="insertAction('Agent')" class="flex items-center space-x-1 px-3 py-1.5 bg-githubCard border border-githubBorder hover:bg-githubBorder rounded-lg text-xs text-gray-300 transition">
                <span class="material-icons text-xs text-purple-400">support_agent</span>
                <span>Agent</span>
            </button>
            <button onclick="openIssueModal()" class="flex items-center space-x-1 px-3 py-1.5 bg-githubCard border border-githubBorder hover:bg-githubBorder rounded-lg text-xs text-gray-300 transition">
                <span class="material-icons text-xs text-green-400">add_circle_outline</span>
                <span>Create issue</span>
            </button>
            <button onclick="insertAction('Write code')" class="flex items-center space-x-1 px-3 py-1.5 bg-githubCard border border-githubBorder hover:bg-githubBorder rounded-lg text-xs text-gray-300 transition">
                <span class="material-icons text-xs text-yellow-400">code</span>
                <span>Write code</span>
            </button>
            <button onclick="insertAction('Git')" class="flex items-center space-x-1 px-3 py-1.5 bg-githubCard border border-githubBorder hover:bg-githubBorder rounded-lg text-xs text-gray-300 transition">
                <span class="material-icons text-xs text-orange-400">merge</span>
                <span>Git</span>
            </button>
        </div>

        <!-- Dynamic Chat Response Container -->
        <div id="chatContainer" class="w-full max-w-2xl mt-6 flex flex-col space-y-3"></div>

    </main>

    <!-- Footer Note -->
    <footer class="w-full py-3 text-center text-xs text-gray-500 border-t border-githubBorder/40">
        Copilot uses AI. Check for mistakes.
    </footer>

    <!-- JavaScript Logic & GitHub OAuth Handler -->
    <script>
        const CLIENT_ID = 'Ov23linzpMw90Zhn3jb2';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        // GitHub Login Function
        function loginWithGitHub() {
            const url = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=repo`;
            window.location.href = url;
        }

        // Check if returning from GitHub with a code
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                document.getElementById('authButtonText').textContent = 'Connected (GitHub)';
                document.getElementById('githubAuthBtn').classList.add('border-green-500', 'text-green-400');
                // Note: Full token exchange requires a backend server due to GitHub's client secret security, 
                // but your UI is now successfully hooked with GitHub auth flow state!
            }
        };

        // Repositories Dropdown Toggle
        const repoBtn = document.getElementById('repoBtn');
        const repoDropdown = document.getElementById('repoDropdown');
        
        if (repoBtn && repoDropdown) {
            repoBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                repoDropdown.classList.toggle('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!repoDropdown.contains(e.target) && !repoBtn.contains(e.target)) {
                    repoDropdown.classList.add('hidden');
                }
            });
        }

        // Repository selection logic
        const repoList = document.getElementById('repoList');
        if (repoList) {
            const items = repoList.querySelectorAll('.repo-item');
            items.forEach(item => {
                item.addEventListener('click', () => {
                    const name = item.querySelector('.repo-name').textContent.trim();
                    document.getElementById('selectedRepoName').textContent = name;
                    repoDropdown.classList.add('hidden');
                });
            });
        }

        // Quick action insertion
        function insertAction(actionText) {
            const input = document.getElementById('promptInput');
            input.value = `[${actionText}] ` + input.value;
            input.focus();
        }

        function openIssueModal() {
            alert('Create Issue ফিচারটি সিলেক্ট করা হয়েছে।');
        }
    </script>
</body>
</html>
