<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Copilot - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        githubDark: '#0d1117',
                        githubCard: '#161b22',
                        githubBorder: '#30363d',
                        githubBlue: '#1f6feb'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="bg-githubDark text-gray-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="w-full border-b border-githubBorder bg-githubDark/80 backdrop-blur sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button id="menuBtn" class="p-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-githubBorder transition">
                <span class="material-icons">menu</span>
            </button>
            <div class="flex items-center space-x-2">
                <span class="material-icons text-blue-500">smart_toy</span>
                <span class="font-semibold text-sm tracking-wide">Copilot AI</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <button class="flex items-center space-x-2 bg-githubCard border border-githubBorder px-3 py-1.5 rounded-md text-xs font-medium shadow-sm border-green-500 text-green-400">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                <span>GitHub Connected</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        <div class="mb-6 p-3 bg-githubCard border border-githubBorder rounded-2xl shadow-lg">
            <span class="material-icons text-3xl text-gray-300">smart_toy</span>
        </div>

        <!-- Central Prompt Box Container -->
        <div class="w-full max-w-2xl bg-githubCard border border-githubBorder rounded-xl p-3 shadow-2xl relative">
            <textarea id="promptInput" rows="2" placeholder="Ask anything or type @ to add context" class="w-full bg-transparent text-gray-200 placeholder-gray-500 text-sm focus:outline-none resize-none px-1">[Write code] একটি সুন্দর ক্যালকুলেটর অ্যাপ বানিয়ে দাও।</textarea>

            <div class="flex flex-wrap items-center justify-between pt-2 border-t border-githubBorder/60 mt-2 gap-2 text-xs">
                <div class="flex items-center space-x-2">
                    <button class="flex items-center space-x-1 px-2 py-1 bg-githubDark border border-githubBorder rounded hover:bg-githubBorder text-gray-300">
                        <span class="material-icons text-xs">chat_bubble_outline</span>
                        <span>Ask</span>
                        <span class="material-icons text-xs">arrow_drop_down</span>
                    </button>

                    <!-- All Repositories Dropdown -->
                    <div class="relative">
                        <button id="repoBtn" class="flex items-center space-x-1 px-2 py-1 bg-githubDark border border-githubBorder rounded hover:bg-githubBorder text-gray-300">
                            <span class="material-icons text-xs">folder</span>
                            <span id="selectedRepoName">sohel622/Flashgram5555</span>
                            <span class="material-icons text-xs">arrow_drop_down</span>
                        </button>

                        <div id="repoDropdown" class="hidden absolute left-0 mt-2 w-72 bg-githubCard border border-githubBorder rounded-lg shadow-2xl z-50 p-2">
                            <div class="p-1 border-b border-githubBorder mb-1">
                                <input type="text" id="repoSearch" placeholder="Search repositories..." class="w-full bg-githubDark text-xs px-2 py-1.5 rounded border border-githubBorder text-gray-200 focus:outline-none">
                            </div>
                            <div id="repoList" class="max-h-48 overflow-y-auto space-y-1">
                                <div class="p-2 text-xs text-gray-400 text-center">Loading repositories...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button id="sendBtn" class="p-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded transition">
                        <span class="material-icons text-xs">send</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Log Container -->
        <div id="statusLog" class="w-full max-w-2xl mt-4 text-xs text-blue-400 font-mono"></div>

    </main>

    <!-- Script Logic -->
    <script>
        // Hardcoded Token provided by user
        const GITHUB_TOKEN = "AQ.Ab8RN6LaCsU9Tqfv8pGQCS1yBFxsIl92kjyDauLKB4rxQAMKLA";
        let currentRepo = "sohel622/Flashgram5555";
        
        const repoBtn = document.getElementById('repoBtn');
        const repoDropdown = document.getElementById('repoDropdown');
        const repoList = document.getElementById('repoList');

        repoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            repoDropdown.classList.toggle('hidden');
            loadRepos();
        });

        document.addEventListener('click', () => repoDropdown.classList.add('hidden'));

        async function loadRepos() {
            try {
                const res = await fetch('https://api.github.com/user/repos?per_page=50', {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                const repos = await res.json();
                repoList.innerHTML = '';
                repos.forEach(repo => {
                    const div = document.createElement('div');
                    div.className = 'px-2 py-1.5 hover:bg-githubBorder rounded cursor-pointer text-xs text-gray-300';
                    div.textContent = repo.full_name;
                    div.onclick = () => {
                        currentRepo = repo.full_name;
                        document.getElementById('selectedRepoName').textContent = currentRepo;
                        repoDropdown.classList.add('hidden');
                    };
                    repoList.appendChild(div);
                });
            } catch (e) {
                repoList.innerHTML = '<div class="p-2 text-xs text-red-400 text-center">রিপোজিটরি লোড করতে সমস্যা হয়েছে</div>';
            }
        }

        // Auto Load Repos on start
        loadRepos();

        // Send Prompt & Auto Commit Code to GitHub
        document.getElementById('sendBtn').onclick = async function() {
            const statusLog = document.getElementById('statusLog');
            statusLog.textContent = "⏳ কোড জেনারেট করা হচ্ছে এবং GitHub-এ পুশ করা হচ্ছে...";

            const newCodeContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-6 rounded-2xl shadow-xl w-80">
        <div id="display" class="bg-gray-900 text-right p-4 text-2xl rounded-xl mb-4 font-mono">0</div>
        <div class="grid grid-cols-4 gap-2">
            <button onclick="clearAll()" class="bg-red-600 p-3 rounded-lg col-span-2">C</button>
            <button onclick="appendValue('/')" class="bg-gray-700 p-3 rounded-lg">/</button>
            <button onclick="appendValue('*')" class="bg-gray-700 p-3 rounded-lg">*</button>
            <button onclick="appendValue('7')" class="bg-gray-700 p-3 rounded-lg">7</button>
            <button onclick="appendValue('8')" class="bg-gray-700 p-3 rounded-lg">8</button>
            <button onclick="appendValue('9')" class="bg-gray-700 p-3 rounded-lg">9</button>
            <button onclick="appendValue('-')" class="bg-gray-700 p-3 rounded-lg">-</button>
            <button onclick="appendValue('4')" class="bg-gray-700 p-3 rounded-lg">4</button>
            <button onclick="appendValue('5')" class="bg-gray-700 p-3 rounded-lg">5</button>
            <button onclick="appendValue('6')" class="bg-gray-700 p-3 rounded-lg">6</button>
            <button onclick="appendValue('+')" class="bg-gray-700 p-3 rounded-lg">+</button>
            <button onclick="appendValue('1')" class="bg-gray-700 p-3 rounded-lg">1</button>
            <button onclick="appendValue('2')" class="bg-gray-700 p-3 rounded-lg">2</button>
            <button onclick="appendValue('3')" class="bg-gray-700 p-3 rounded-lg">3</button>
            <button onclick="calculate()" class="bg-blue-600 p-3 rounded-lg row-span-2">=</button>
            <button onclick="appendValue('0')" class="bg-gray-700 p-3 rounded-lg col-span-2">0</button>
            <button onclick="appendValue('.')" class="bg-gray-700 p-3 rounded-lg">.</button>
        </div>
    </div>
    <script>
        let disp = document.getElementById('display');
        function appendValue(v) { if(disp.innerText==='0') disp.innerText=v; else disp.innerText+=v; }
        function clearAll() { disp.innerText='0'; }
        function calculate() { try { disp.innerText = eval(disp.innerText); } catch { disp.innerText='Error'; } }
    <\/script>
</body>
</html>`;

            try {
                const filePath = "index.html";
                const apiUrl = `https://api.github.com/repos/${currentRepo}/contents/${filePath}`;

                let sha = "";
                const getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const bodyData = {
                    message: "AI Agent: Auto generated calculator app",
                    content: btoa(unescape(encodeURIComponent(newCodeContent))),
                    sha: sha ? sha : undefined
                };

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (putRes.ok) {
                    statusLog.textContent = "✅ সফলভাবে কোড জেনারেট হয়ে GitHub-এ কমিট ও পুশ হয়ে গেছে!";
                } else {
                    statusLog.textContent = "❌ পুশ করতে সমস্যা হয়েছে।";
                }
            } catch (e) {
                statusLog.textContent = "❌ এরর: " + e.message;
            }
        };
    </script>
</body>
</html>
